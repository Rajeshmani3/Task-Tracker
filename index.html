<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
   
</head>
<body>
    <main class="todo-container">
        <h1 class="todo-title">TODOS</h1>
       <!--search bar-->
        <div class="input-section">
            <input type="text" id="task-input" class="task-input" placeholder="Enter Your tasks...">
            <button type="button" id="add-btn" class="add-btn">+</button>
        </div>
        <!-- Tasks tab -->
<div class="filter-section">
    <button  class="filter-btn active" data-filter="all">All</button>
    <button  class="filter-btn " data-filter="active">Active</button>
    <button  class="filter-btn " data-filter="completed">Completed</button>
</div>
      
            <!-- Task List -->
<ul id="task-list" class="task-list">

    <!-- Default Task -->
    <li class="task-item">
        <input type="checkbox" class="task-checkbox">
        <span>Drink water</span>
           <button type="button" class="edit-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil.svg"  alt="Edit"></button>
        <button type="button" class="delete-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/trash.svg" alt="Delete"></button>
     
    </li>
    
    <li class="task-item">
        <input type="checkbox" class="task-checkbox">
        <span>Read a book</span>
           <button type="button" class="edit-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil.svg"  alt="Edit"></button>
        <button type="button" class="delete-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/trash.svg" alt="Delete"></button>
    </li>

    <li class="task-item">
        <input type="checkbox" class="task-checkbox">
        <span>Complete daily tasks</span>
             <button type="button" class="edit-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil.svg"  alt="Edit"></button>
        <button type="button" class="delete-btn"><img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/trash.svg" alt="Delete"></button>
    </li>

</ul>
        
 <!-- TASK FOOTER -->
  <div class="task-footer">
    <p id="active-count">0 Active Tasks</p>
 <!-- Clear Completed Tasks -->   
        <button type="button" id="clear-completed-btn" >Clear Completed Task</button>
       </div>
    </main>
</body>
</html>
